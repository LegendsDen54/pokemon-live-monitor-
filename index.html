<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#02050b">
<title>Pokémon Drop Monitor</title>

<style>
*{box-sizing:border-box}

:root{
  --blue:#22a9ff;
  --cyan:#6edcff;
  --green:#42f59b;
  --gold:#ffd447;
  --orange:#ff9e3d;
  --red:#ff5668;
  --text:#f5f9ff;
  --muted:#91a3bb;
}

html,body{
  margin:0;
  min-height:100%;
  background:#02050b;
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

body{
  min-height:100vh;
  background-image:
    linear-gradient(
      180deg,
      rgba(1,4,10,.08) 0%,
      rgba(1,4,10,.28) 35%,
      rgba(1,4,10,.78) 72%,
      #02050b 100%
    ),
    url("./mega_charizard_x_drop_monitor.png");

  background-size:cover;
  background-position:center top;
  background-repeat:no-repeat;
  background-attachment:fixed;
}

body:after{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  background:
    radial-gradient(
      circle at 15% 35%,
      rgba(30,156,255,.12),
      transparent 28%
    ),
    radial-gradient(
      circle at 85% 35%,
      rgba(255,83,35,.10),
      transparent 30%
    );
}

.app{
  width:min(1180px,100%);
  margin:auto;
  padding:18px 13px 70px;
  position:relative;
  z-index:1;
}

.top{
  min-height:360px;
  display:flex;
  flex-direction:column;
  justify-content:flex-end;
  padding-bottom:16px;
}

.liveRow{
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:9px;
}

.live,
.alertButton{
  backdrop-filter:blur(15px);
  -webkit-backdrop-filter:blur(15px);

  padding:10px 14px;
  border-radius:999px;
  font-size:10px;
  font-weight:950;
  letter-spacing:.6px;
}

.live{
  display:flex;
  align-items:center;
  gap:8px;

  color:var(--green);

  background:rgba(5,22,24,.72);

  border:
    1px solid rgba(66,245,155,.35);

  box-shadow:
    0 0 25px rgba(66,245,155,.12);
}

.dot{
  width:8px;
  height:8px;
  border-radius:50%;

  background:currentColor;

  box-shadow:
    0 0 12px currentColor;

  animation:pulse 1.5s infinite;
}

@keyframes pulse{
  50%{
    opacity:.35;
    transform:scale(.75);
  }
}

.alertButton{
  cursor:pointer;

  color:#bde6ff;

  background:rgba(5,25,47,.72);

  border:
    1px solid rgba(34,169,255,.35);
}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;

  margin:0 0 18px;
}

.stat{
  text-align:center;

  padding:14px 5px;

  border-radius:16px;

  background:
    linear-gradient(
      145deg,
      rgba(9,22,43,.88),
      rgba(3,8,17,.91)
    );

  border:
    1px solid rgba(73,166,240,.23);

  backdrop-filter:blur(15px);
  -webkit-backdrop-filter:blur(15px);

  box-shadow:
    0 12px 35px rgba(0,0,0,.35);
}

.stat strong{
  display:block;

  font-size:25px;

  text-shadow:
    0 0 16px rgba(34,169,255,.4);
}

.stat span{
  display:block;

  margin-top:5px;

  color:#8095ae;

  font-size:9px;

  font-weight:900;

  text-transform:uppercase;

  letter-spacing:.7px;
}

.monitor{
  overflow:hidden;

  border-radius:22px;

  border:
    1px solid rgba(60,162,242,.28);

  background:
    linear-gradient(
      145deg,
      rgba(7,17,35,.91),
      rgba(3,8,17,.94)
    );

  backdrop-filter:blur(17px);
  -webkit-backdrop-filter:blur(17px);

  box-shadow:
    0 25px 60px rgba(0,0,0,.45);
}

.monitorHeader{
  padding:16px;

  display:flex;

  justify-content:space-between;

  align-items:flex-end;

  gap:12px;

  border-bottom:
    1px solid rgba(255,255,255,.06);
}

.label{
  color:var(--blue);

  font-size:9px;

  font-weight:950;

  letter-spacing:1.5px;
}

.monitorHeader h2{
  margin:4px 0 0;

  font-size:18px;
}

.lastScan{
  color:#7489a4;

  font-size:9px;

  text-align:right;
}

.scanLine{
  height:2px;

  overflow:hidden;

  background:rgba(255,255,255,.03);
}

.scanLine:after{
  content:"";

  display:block;

  height:100%;

  width:30%;

  background:
    linear-gradient(
      90deg,
      transparent,
      #36bdff,
      transparent
    );

  box-shadow:
    0 0 15px #36bdff;

  animation:scan 2s linear infinite;
}

@keyframes scan{
  from{transform:translateX(-120%)}
  to{transform:translateX(440%)}
}

.grid{
  display:grid;

  grid-template-columns:
    repeat(auto-fit,minmax(270px,1fr));

  gap:11px;

  padding:12px;
}

.card{
  padding:13px;

  border-radius:17px;

  background:
    linear-gradient(
      145deg,
      rgba(14,29,54,.94),
      rgba(5,11,23,.96)
    );

  border:
    1px solid rgba(75,158,226,.18);
}

.stockCard{
  border-color:
    rgba(66,245,155,.4);

  box-shadow:
    inset 0 0 30px rgba(66,245,155,.03),
    0 0 22px rgba(66,245,155,.06);
}

.marketCard{
  border-color:
    rgba(255,158,61,.28);
}

.cardTop{
  display:flex;
  gap:12px;
}

.imageBox{
  width:94px;
  height:105px;

  flex:none;

  display:grid;

  place-items:center;

  overflow:hidden;

  border-radius:13px;

  background:
    rgba(255,255,255,.05);

  border:
    1px solid rgba(255,255,255,.08);
}

.imageBox img{
  width:100%;
  height:100%;

  object-fit:contain;

  background:white;

  padding:3px;
}

.placeholder{
  font-size:31px;
  opacity:.6;
}

.info{
  min-width:0;
  flex:1;
}

.set{
  color:#57bfff;

  font-size:8px;

  font-weight:950;

  letter-spacing:.8px;

  text-transform:uppercase;
}

.name{
  margin-top:5px;

  font-size:13px;

  line-height:1.3;

  font-weight:850;
}

.price{
  margin-top:8px;

  color:var(--gold);

  font-size:22px;

  font-weight:1000;
}

.badge{
  display:inline-flex;

  margin-top:9px;

  padding:6px 8px;

  border-radius:999px;

  font-size:8px;

  font-weight:1000;

  letter-spacing:.5px;
}

.green{
  color:#59f5a8;

  background:
    rgba(66,245,155,.10);

  border:
    1px solid rgba(66,245,155,.3);
}

.orange{
  color:#ffc16e;

  background:
    rgba(255,158,61,.10);

  border:
    1px solid rgba(255,158,61,.3);
}

.red{
  color:#ff7a88;

  background:
    rgba(255,86,104,.10);

  border:
    1px solid rgba(255,86,104,.25);
}

.gray{
  color:#a6b5c8;

  background:
    rgba(166,181,200,.08);

  border:
    1px solid rgba(166,181,200,.18);
}

.meta{
  margin-top:10px;

  padding-top:9px;

  border-top:
    1px solid rgba(255,255,255,.06);

  color:#8092aa;

  font-size:9px;

  line-height:1.6;
}

.warning{
  margin-top:9px;

  padding:9px;

  border-radius:10px;

  color:#ffc271;

  background:
    rgba(255,158,61,.07);

  border:
    1px solid rgba(255,158,61,.13);

  font-size:9px;

  line-height:1.45;
}

.buy{
  display:block;

  margin-top:10px;

  padding:11px;

  text-align:center;

  text-decoration:none;

  border-radius:11px;

  color:#00130a;

  background:
    linear-gradient(
      90deg,
      #42e992,
      #80ffb9
    );

  font-size:10px;

  font-weight:1000;

  letter-spacing:.4px;

  box-shadow:
    0 0 20px rgba(66,245,155,.15);
}

.empty{
  grid-column:1/-1;

  padding:44px 20px;

  text-align:center;

  color:#7d91aa;
}

.radar{
  width:58px;
  height:58px;

  margin:0 auto 14px;

  position:relative;

  border-radius:50%;

  border:
    1px solid rgba(34,169,255,.45);

  box-shadow:
    0 0 25px rgba(34,169,255,.14);
}

.radar:before{
  content:"";

  position:absolute;

  inset:10px;

  border-radius:50%;

  border:
    1px solid rgba(34,169,255,.25);
}

.radar:after{
  content:"";

  position:absolute;

  inset:23px;

  border-radius:50%;

  background:#39baff;

  box-shadow:
    0 0 14px #39baff;
}

.empty strong{
  display:block;

  margin-bottom:6px;

  color:#bdd0e5;
}

.footer{
  padding:22px 10px;

  text-align:center;

  color:#52657c;

  font-size:8px;

  letter-spacing:.7px;
}

@media(max-width:600px){

  body{
    background-size:auto 620px;
    background-position:center top;
    background-attachment:scroll;
  }

  .app{
    padding:
      max(10px,env(safe-area-inset-top))
      10px
      50px;
  }

  .top{
    min-height:390px;
  }

  .stats{
    gap:6px;
  }

  .stat strong{
    font-size:22px;
  }

  .imageBox{
    width:88px;
    height:99px;
  }
}
</style>
</head>

<body>

<div class="app">

  <section class="top">

    <div class="liveRow">

      <div class="live" id="connection">
        <span class="dot"></span>
        CONNECTING
      </div>

      <button
        class="alertButton"
        onclick="enableAlerts()"
      >
        🔔 ENABLE iPHONE ALERTS
      </button>

    </div>

  </section>

  <section class="stats">

    <div class="stat">
      <strong id="monitored">0</strong>
      <span>Monitored</span>
    </div>

    <div class="stat">
      <strong id="stock">0</strong>
      <span>In Stock</span>
    </div>

    <div class="stat">
      <strong id="direct">0</strong>
      <span>Walmart Direct</span>
    </div>

  </section>

  <section class="monitor">

    <div class="monitorHeader">

      <div>
        <div class="label">
          WALMART SCANNER
        </div>

        <h2>
          Live Product Monitoring
        </h2>
      </div>

      <div
        class="lastScan"
        id="lastScan"
      >
        Waiting for scan
      </div>

    </div>

    <div class="scanLine"></div>

    <main
      class="grid"
      id="products"
    >

      <div class="empty">

        <div class="radar"></div>

        <strong>
          Connecting to scanner...
        </strong>

        Establishing backend connection.

      </div>

    </main>

  </section>

  <div class="footer">
    WALMART DIRECT • MARKETPLACE FILTER • LIVE INVENTORY ENGINE
  </div>

</div>

<script>

const API =
  "https://pokemon-live-backend.onrender.com";

function esc(v){

  return String(v ?? "")

    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function money(v){

  const n =
    Number(v);

  if(
    !Number.isFinite(n)
  ){
    return "—";
  }

  return new Intl.NumberFormat(
    "en-US",
    {
      style:"currency",
      currency:"USD"
    }
  ).format(n);
}

function status(x){

  if(
    x.inStock === true &&
    x.directSeller === true
  ){
    return [
      "WALMART IN STOCK",
      "green"
    ];
  }

  if(
    x.marketplaceOnly === true
  ){
    return [
      "MARKETPLACE ONLY",
      "orange"
    ];
  }

  if(
    x.discoveryMode === true ||
    x.error ===
      "No validated Walmart-direct result found" ||
    x.error ===
      "No Walmart-sold result found"
  ){
    return [
      "NO DIRECT MATCH",
      "gray"
    ];
  }

  return [
    "OUT OF STOCK",
    "red"
  ];
}

function render(items){

  const root =
    document.getElementById(
      "products"
    );

  const direct =
    items.filter(
      x =>
        x.directSeller === true
    );

  const stock =
    items.filter(
      x =>
        x.directSeller === true &&
        x.inStock === true
    );

  document.getElementById(
    "monitored"
  ).textContent =
    items.length;

  document.getElementById(
    "stock"
  ).textContent =
    stock
