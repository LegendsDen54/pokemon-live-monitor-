<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#060914">
<title>Pokémon Drop Monitor</title>

<style>
*{box-sizing:border-box}

:root{
  --bg:#060914;
  --panel:rgba(16,23,42,.88);
  --panel2:rgba(23,32,56,.82);
  --line:rgba(255,255,255,.1);
  --text:#f7f9ff;
  --muted:#929db5;
  --blue:#42a5ff;
  --yellow:#ffd84c;
  --green:#42df91;
  --red:#ff6170;
  --orange:#ffad42;
}

body{
  margin:0;
  min-height:100vh;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  color:var(--text);
  background:
    radial-gradient(circle at 10% 0%,rgba(44,130,255,.25),transparent 30%),
    radial-gradient(circle at 95% 10%,rgba(255,190,50,.18),transparent 28%),
    radial-gradient(circle at 50% 100%,rgba(90,45,190,.16),transparent 35%),
    var(--bg);
  background-attachment:fixed;
}

body:before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  background-image:
    linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px);
  background-size:30px 30px;
}

.wrap{
  width:min(1120px,100%);
  margin:auto;
  padding:24px 16px 70px;
  position:relative;
}

.hero{
  padding:25px 20px;
  border:1px solid var(--line);
  border-radius:24px;
  background:linear-gradient(145deg,rgba(22,32,60,.94),rgba(8,12,25,.92));
  box-shadow:0 20px 60px rgba(0,0,0,.4);
  overflow:hidden;
  position:relative;
}

.hero:after{
  content:"";
  position:absolute;
  width:190px;
  height:190px;
  right:-70px;
  top:-75px;
  border-radius:50%;
  border:25px solid rgba(255,216,76,.07);
}

.brand{
  display:flex;
  align-items:center;
  gap:12px;
  margin-bottom:14px;
}

.logo{
  width:48px;
  height:48px;
  border-radius:15px;
  display:grid;
  place-items:center;
  font-size:25px;
  background:linear-gradient(145deg,#1676dd,#ffd84c);
  box-shadow:0 0 30px rgba(50,150,255,.25);
}

h1{
  margin:0;
  font-size:clamp(27px,7vw,46px);
  letter-spacing:-1.3px;
}

.subtitle{
  margin:6px 0 0;
  color:var(--muted);
  line-height:1.5;
}

.livebar{
  margin-top:18px;
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  align-items:center;
}

.live{
  display:inline-flex;
  align-items:center;
  gap:8px;
  padding:9px 13px;
  border-radius:999px;
  font-size:12px;
  font-weight:900;
  letter-spacing:.5px;
  background:rgba(66,223,145,.12);
  color:var(--green);
  border:1px solid rgba(66,223,145,.3);
}

.dot{
  width:9px;
  height:9px;
  border-radius:50%;
  background:currentColor;
  box-shadow:0 0 13px currentColor;
}

.alertBtn{
  border:1px solid rgba(66,165,255,.35);
  background:rgba(66,165,255,.12);
  color:#8dcbff;
  border-radius:999px;
  padding:9px 13px;
  font-weight:800;
  cursor:pointer;
}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin:16px 0;
}

.stat{
  border:1px solid var(--line);
  background:var(--panel);
  border-radius:18px;
  padding:16px 10px;
  text-align:center;
  backdrop-filter:blur(12px);
}

.stat strong{
  display:block;
  font-size:27px;
  margin-bottom:5px;
}

.stat span{
  color:var(--muted);
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:.6px;
}

.toolbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin:25px 2px 12px;
}

.toolbar h2{
  margin:0;
  font-size:19px;
}

.scan{
  color:var(--muted);
  font-size:12px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
  gap:14px;
}

.card{
  border:1px solid var(--line);
  background:linear-gradient(145deg,var(--panel2),rgba(10,15,29,.94));
  border-radius:22px;
  padding:15px;
  box-shadow:0 15px 40px rgba(0,0,0,.25);
  overflow:hidden;
}

.productTop{
  display:flex;
  gap:14px;
}

.productImage{
  width:105px;
  height:105px;
  flex:none;
  object-fit:contain;
  border-radius:15px;
  background:white;
  padding:5px;
}

.imagePlaceholder{
  width:105px;
  height:105px;
  flex:none;
  display:grid;
  place-items:center;
  border-radius:15px;
  background:rgba(255,255,255,.05);
  color:var(--muted);
  font-size:32px;
}

.productInfo{
  min-width:0;
  flex:1;
}

.set{
  color:#75bcff;
  text-transform:uppercase;
  font-size:10px;
  font-weight:900;
  letter-spacing:.8px;
}

.name{
  margin:5px 0 8px;
  font-weight:850;
  line-height:1.3;
}

.price{
  font-size:24px;
  font-weight:900;
  color:var(--yellow);
}

.meta{
  color:var(--muted);
  font-size:12px;
  line-height:1.55;
  margin-top:10px;
}

.status{
  display:inline-flex;
  margin-top:12px;
  padding:8px 11px;
  border-radius:999px;
  font-size:11px;
  font-weight:950;
  letter-spacing:.5px;
}

.stock{
  color:var(--green);
  background:rgba(66,223,145,.12);
  border:1px solid rgba(66,223,145,.3);
}

.market{
  color:var(--orange);
  background:rgba(255,173,66,.12);
  border:1px solid rgba(255,173,66,.3);
}

.out{
  color:var(--red);
  background:rgba(255,97,112,.12);
  border:1px solid rgba(255,97,112,.3);
}

.nomatch{
  color:#aab4c8;
  background:rgba(170,180,200,.09);
  border:1px solid rgba(170,180,200,.2);
}

.warning{
  margin-top:12px;
  padding:10px;
  border-radius:12px;
  background:rgba(255,173,66,.08);
  color:#ffc470;
  font-size:12px;
  line-height:1.45;
}

.buy{
  display:block;
  text-align:center;
  text-decoration:none;
  color:#06101a;
  font-weight:950;
  margin-top:13px;
  padding:13px;
  border-radius:14px;
  background:linear-gradient(90deg,#42df91,#74f5b0);
}

.empty{
  grid-column:1/-1;
  text-align:center;
  border:1px dashed rgba(255,255,255,.15);
  border-radius:22px;
  padding:50px 20px;
  color:var(--muted);
  background:rgba(255,255,255,.025);
}

.emptyIcon{
  font-size:42px;
  margin-bottom:10px;
}

.footer{
  margin-top:28px;
  text-align:center;
  color:#657089;
  font-size:11px;
}

@media(max-width:500px){
  .wrap{padding:14px 12px 55px}
  .hero{padding:20px 16px}
  .stats{gap:7px}
  .stat{padding:14px 5px}
  .stat strong{font-size:23px}
  .productImage,.imagePlaceholder{
    width:92px;
    height:92px;
  }
}
</style>
</head>

<body>

<div class="wrap">

  <section class="hero">
    <div class="brand">
      <div class="logo">⚡</div>

      <div>
        <h1>Pokémon Drop Monitor</h1>
        <p class="subtitle">
          Live collector inventory command center
        </p>
      </div>
    </div>

    <div class="livebar">
      <div class="live" id="connection">
        <span class="dot"></span>
        CONNECTING
      </div>

      <button
        class="alertBtn"
        onclick="enableAlerts()"
      >
        🔔 Enable Alerts
      </button>
    </div>
  </section>

  <section class="stats">
    <div class="stat">
      <strong id="monitored">0</strong>
      <span>Monitored</span>
    </div>

    <div class="stat">
      <strong id="stock">0</strong>
      <span>Walmart Stock</span>
    </div>

    <div class="stat">
      <strong id="direct">0</strong>
      <span>Walmart Direct</span>
    </div>
  </section>

  <div class="toolbar">
    <h2>Live Scanner</h2>
    <div class="scan" id="lastScan">
      Waiting for scan
    </div>
  </div>

  <main class="grid" id="products">
    <div class="empty">
      <div class="emptyIcon">📡</div>
      Connecting to scanner...
    </div>
  </main>

  <div class="footer">
    Walmart • Target coming next • Collector monitoring system
  </div>

</div>

<script>
const API =
  "https://pokemon-live-backend.onrender.com";

function esc(value){
  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function money(value){
  const n = Number(value);

  if(!Number.isFinite(n)){
    return "Price unavailable";
  }

  return new Intl.NumberFormat(
    "en-US",
    {
      style:"currency",
      currency:"USD"
    }
  ).format(n);
}

function statusFor(item){
  if(
    item.inStock === true &&
    item.directSeller === true
  ){
    return {
      text:"WALMART IN STOCK",
      className:"stock"
    };
  }

  if(item.marketplaceOnly === true){
    return {
      text:"MARKETPLACE ONLY",
      className:"market"
    };
  }

  if(
    item.discoveryMode === true ||
    item.error ===
      "No validated Walmart-direct result found" ||
    item.error ===
      "No Walmart-sold result found"
  ){
    return {
      text:"NO DIRECT MATCH",
      className:"nomatch"
    };
  }

  return {
    text:"OUT OF STOCK",
    className:"out"
  };
}

function render(items){
  const root =
    document.getElementById("products");

  document.getElementById(
    "monitored"
  ).textContent = items.length;

  const direct =
    items.filter(
      x => x.directSeller === true
    );

  const stock =
    items.filter(
      x =>
        x.directSeller === true &&
        x.inStock === true
    );

  document.getElementById(
    "direct"
  ).textContent = direct.length;

  document.getElementById(
    "stock"
  ).textContent = stock.length;

  if(!items.length){
    root.innerHTML = `
      <div class="empty">
        <div class="emptyIcon">📡</div>
        <strong>No scanner results yet</strong>
        <div style="margin-top:8px">
          The monitor is connected and waiting
          for the next inventory scan.
        </div>
      </div>
    `;

    return;
  }

  root.innerHTML =
    items.map(item => {
      const status =
        statusFor(item);

      const image =
        item.image
          ? `
            <img
              class="productImage"
              src="${esc(item.image)}"
              alt=""
            >
          `
          : `
            <div class="imagePlaceholder">
              📦
            </div>
          `;

      const warning =
        item.marketplaceOnly
          ? `
            <div class="warning">
              Third-party marketplace offer detected.
              No Walmart-direct stock alert will fire.
            </div>
          `
          : "";

      const buy =
        item.url &&
        item.directSeller === true &&
        item.inStock === true
          ? `
            <a
              class="buy"
              href="${esc(item.url)}"
              target="_blank"
              rel="noopener"
            >
              OPEN WALMART →
            </a>
          `
          : "";

      return `
        <article class="card">

          <div class="productTop">

            ${image}

            <div class="productInfo">

              <div class="set">
                ${esc(item.set || "Pokémon TCG")}
              </div>

              <div class="name">
                ${esc(item.name || "Pokémon Product")}
              </div>

              <div class="price">
                ${money(item.price)}
              </div>

            </div>

          </div>

          <div class="status ${status.className}">
            ${status.text}
          </div>

          <div class="meta">
            Retailer:
            ${esc(item.retailer || "Unknown")}
            <br>

            Seller:
            ${esc(item.seller || "Not available")}

            ${
              item.sellerType
                ? `<br>Seller type: ${esc(item.sellerType)}`
                : ""
            }

            ${
              item.checkedAt
                ? `<br>Checked: ${new Date(
                    item.checkedAt
                  ).toLocaleString()}`
                : ""
            }
          </div>

          ${warning}
          ${buy}

        </article>
      `;
    }).join("");
}

async function load(){
  const connection =
    document.getElementById("connection");

  try{
    const response =
      await fetch(
        `${API}/api/status`,
        {
          cache:"no-store"
        }
      );

    if(!response.ok){
      throw new Error(
        `Backend ${response.status}`
      );
    }

    const data =
      await response.json();

    connection.innerHTML =
      `<span class="dot"></span> LIVE MONITOR CONNECTED`;

    connection.style.color =
      "var(--green)";

    render(
      Array.isArray(data.items)
        ? data.items
        : []
    );

    const lastScan =
      document.getElementById(
        "lastScan"
      );

    lastScan.textContent =
      data.lastRun
        ? `Last scan: ${
            new Date(
              data.lastRun
            ).toLocaleTimeString()
          }`
        : "Waiting for scan";

  }catch(error){

    connection.innerHTML =
      `<span class="dot"></span> BACKEND OFFLINE`;

    connection.style.color =
      "var(--red)";

    document.getElementById(
      "products"
    ).innerHTML = `
      <div class="empty">
        <div class="emptyIcon">⚠️</div>
        <strong>Scanner connection failed</strong>
        <div style="margin-top:8px">
          ${esc(error.message)}
        </div>
      </div>
    `;
  }
}

async function enableAlerts(){
  if(!("Notification" in window)){
    alert(
      "Notifications are not supported in this browser."
    );
    return;
  }

  const permission =
    await Notification.requestPermission();

  if(permission === "granted"){
    new Notification(
      "Pokémon Drop Monitor",
      {
        body:
          "Alerts are enabled on this device."
      }
    );
  }
}

load();

setInterval(
  load,
  30000
);
</script>

</body>
</html>
