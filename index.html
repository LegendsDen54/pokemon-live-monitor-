<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#020713">
<title>Pokémon Restock Monitor</title>

<style>
*{box-sizing:border-box}

:root{
  --blue:#20aaff;
  --green:#43f39a;
  --gold:#ffd84c;
  --orange:#ff9d3d;
  --red:#ff5969;
  --text:#f7fbff;
  --muted:#8da4bf;
}

html,body{
  margin:0;
  min-height:100%;
  background:#020713;
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

body{
  min-height:100vh;
}

/* BACKGROUND */

.wallpaper{
  position:fixed;
  inset:0;
  z-index:0;

  background-image:
    linear-gradient(
      180deg,
      rgba(0,3,10,.05) 0%,
      rgba(0,3,10,.10) 38%,
      rgba(0,3,10,.42) 65%,
      rgba(0,3,10,.92) 100%
    ),
    url("./restock_background.png");

  background-repeat:no-repeat;
  background-position:center top;
  background-size:cover;
}

@media (orientation:portrait){
  .wallpaper{
    background-size:100% auto;
    background-position:center top;
  }
}

@media (orientation:landscape){
  .wallpaper{
    background-size:cover;
    background-position:center 35%;
  }
}

/* APP */

.app{
  position:relative;
  z-index:2;

  width:min(1100px,100%);
  margin:0 auto;

  padding:
    max(12px,env(safe-area-inset-top))
    12px
    max(50px,env(safe-area-inset-bottom));
}

/* HERO */

.heroSpace{
  min-height:64vh;

  display:flex;
  flex-direction:column;
  justify-content:flex-end;
  align-items:center;

  padding-bottom:14px;
}

.controls{
  position:relative;
  z-index:20;

  width:100%;

  display:flex;
  justify-content:center;
  flex-wrap:wrap;

  gap:8px;
}

.live,
.alertBtn{
  min-height:44px;

  padding:10px 14px;

  border-radius:999px;

  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);

  font-size:10px;
  font-weight:950;
  letter-spacing:.5px;
}

/* CONNECTION */

.live{
  display:flex;
  align-items:center;
  gap:8px;

  color:var(--green);

  background:rgba(0,20,25,.78);

  border:1px solid rgba(67,243,154,.42);

  box-shadow:
    0 0 25px rgba(67,243,154,.12);
}

.dot{
  width:8px;
  height:8px;

  border-radius:50%;

  background:currentColor;

  box-shadow:0 0 12px currentColor;

  animation:pulse 1.5s infinite;
}

@keyframes pulse{
  50%{
    opacity:.35;
    transform:scale(.75);
  }
}

/* ALERT BUTTON */

.alertBtn{
  position:relative;
  z-index:30;

  appearance:none;
  -webkit-appearance:none;

  cursor:pointer;
  touch-action:manipulation;

  color:#c3e8ff;

  background:rgba(4,25,48,.86);

  border:1px solid rgba(32,170,255,.4);

  box-shadow:
    0 0 22px rgba(32,170,255,.1);
}

.alertBtn:active{
  transform:scale(.96);
}

.alertBtn.enabled{
  color:#5bf5aa;

  border-color:
    rgba(67,243,154,.55);

  background:
    rgba(0,40,27,.88);
}

.alertBtn.blocked{
  color:#ffb2ba;

  border-color:
    rgba(255,89,105,.5);

  background:
    rgba(50,5,10,.85);
}

/* STATS */

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);

  gap:7px;

  margin-bottom:10px;
}

.stat{
  text-align:center;

  padding:13px 5px;

  border-radius:15px;

  background:
    linear-gradient(
      145deg,
      rgba(6,22,45,.88),
      rgba(2,9,20,.91)
    );

  border:
    1px solid rgba(45,171,255,.28);

  backdrop-filter:blur(17px);
  -webkit-backdrop-filter:blur(17px);

  box-shadow:
    0 12px 35px rgba(0,0,0,.35);
}

.stat strong{
  display:block;

  font-size:23px;

  color:#fff;

  text-shadow:
    0 0 18px rgba(32,170,255,.4);
}

.stat span{
  display:block;

  margin-top:5px;

  color:#8ba2bc;

  font-size:8px;

  font-weight:950;

  letter-spacing:.7px;

  text-transform:uppercase;
}

/* MONITOR */

.monitor{
  overflow:hidden;

  border-radius:20px;

  background:
    linear-gradient(
      145deg,
      rgba(5,18,38,.91),
      rgba(2,8,18,.94)
    );

  border:
    1px solid rgba(45,171,255,.35);

  backdrop-filter:blur(19px);
  -webkit-backdrop-filter:blur(19px);

  box-shadow:
    0 20px 60px rgba(0,0,0,.48),
    0 0 30px rgba(32,170,255,.06);
}

.monitorHead{
  display:flex;

  align-items:flex-end;
  justify-content:space-between;

  gap:12px;

  padding:15px;
}

.smallTitle{
  color:var(--blue);

  font-size:8px;

  font-weight:1000;

  letter-spacing:1.4px;
}

.monitorHead h2{
  margin:4px 0 0;

  font-size:17px;
}

.lastScan{
  max-width:130px;

  color:#7990aa;

  font-size:9px;

  text-align:right;
}

/* SCANNER ANIMATION */

.scanLine{
  height:2px;

  overflow:hidden;

  background:
    rgba(255,255,255,.04);
}

.scanLine:after{
  content:"";

  display:block;

  width:30%;
  height:100%;

  background:
    linear-gradient(
      90deg,
      transparent,
      #35bdff,
      transparent
    );

  box-shadow:
    0 0 15px #35bdff;

  animation:scan 2s linear infinite;
}

@keyframes scan{
  from{
    transform:translateX(-120%);
  }

  to{
    transform:translateX(440%);
  }
}

/* PRODUCT GRID */

.grid{
  display:grid;

  grid-template-columns:
    repeat(
      auto-fit,
      minmax(270px,1fr)
    );

  gap:10px;

  padding:11px;
}

.card{
  padding:12px;

  border-radius:16px;

  background:
    linear-gradient(
      145deg,
      rgba(11,29,55,.95),
      rgba(4,11,23,.96)
    );

  border:
    1px solid rgba(64,164,234,.20);
}

.stockCard{
  border-color:
    rgba(67,243,154,.45);
}

.marketCard{
  border-color:
    rgba(255,157,61,.34);
}

.cardTop{
  display:flex;
  gap:11px;
}

.imageBox{
  width:90px;
  height:102px;

  flex:none;

  overflow:hidden;

  display:grid;
  place-items:center;

  border-radius:12px;

  background:
    rgba(255,255,255,.05);

  border:
    1px solid rgba(255,255,255,.08);
}

.imageBox img{
  width:100%;
  height:100%;

  object-fit:contain;

  background:white;

  padding:3px;
}

.placeholder{
  font-size:30px;
}

.info{
  min-width:0;
  flex:1;
}

.set{
  color:#52bdff;

  font-size:8px;

  font-weight:950;

  letter-spacing:.8px;

  text-transform:uppercase;
}

.name{
  margin-top:5px;

  font-size:13px;

  font-weight:850;

  line-height:1.3;
}

.price{
  margin-top:7px;

  color:var(--gold);

  font-size:21px;

  font-weight:1000;
}

.badge{
  display:inline-flex;

  margin-top:8px;

  padding:6px 8px;

  border-radius:999px;

  font-size:8px;

  font-weight:1000;

  letter-spacing:.4px;
}

.green{
  color:#5bf5aa;

  background:
    rgba(67,243,154,.10);

  border:
    1px solid rgba(67,243,154,.3);
}

.orange{
  color:#ffc16f;

  background:
    rgba(255,157,61,.10);

  border:
    1px solid rgba(255,157,61,.3);
}

.red{
  color:#ff7b89;

  background:
    rgba(255,89,105,.10);

  border:
    1px solid rgba(255,89,105,.25);
}

.gray{
  color:#a7b6c9;

  background:
    rgba(167,182,201,.08);

  border:
    1px solid rgba(167,182,201,.18);
}

.meta{
  margin-top:9px;

  padding-top:8px;

  border-top:
    1px solid rgba(255,255,255,.06);

  color:#8095ae;

  font-size:9px;

  line-height:1.6;
}

.warning{
  margin-top:8px;

  padding:8px;

  border-radius:9px;

  color:#ffc372;

  background:
    rgba(255,157,61,.07);

  border:
    1px solid rgba(255,157,61,.14);

  font-size:9px;

  line-height:1.4;
}

.buy{
  display:block;

  margin-top:9px;

  padding:11px;

  text-align:center;

  text-decoration:none;

  border-radius:10px;

  color:#00150a;

  background:
    linear-gradient(
      90deg,
      #42ea94,
      #80ffba
    );

  font-size:10px;

  font-weight:1000;

  box-shadow:
    0 0 20px rgba(67,243,154,.15);
}

/* EMPTY STATE */

.empty{
  grid-column:1/-1;

  padding:40px 20px;

  text-align:center;

  color:#8197b0;
}

.radar{
  width:55px;
  height:55px;

  margin:0 auto 13px;

  position:relative;

  border-radius:50%;

  border:
    1px solid rgba(32,170,255,.45);

  box-shadow:
    0 0 25px rgba(32,170,255,.14);
}

.radar:before{
  content:"";

  position:absolute;

  inset:10px;

  border-radius:50%;

  border:
    1px solid rgba(32,170,255,.25);
}

.radar:after{
  content:"";

  position:absolute;

  inset:22px;

  border-radius:50%;

  background:#38baff;

  box-shadow:
    0 0 13px #38baff;
}

.empty strong{
  display:block;

  margin-bottom:6px;

  color:#bfd2e6;
}

/* FOOTER */

.footer{
  padding:19px 8px;

  text-align:center;

  color:#536a84;

  font-size:8px;

  letter-spacing:.7px;
}

/* PORTRAIT */

@media (orientation:portrait){

  .heroSpace{
    min-height:63vh;
  }
}

/* LANDSCAPE */

@media (orientation:landscape){

  .app{
    width:min(1200px,96%);
  }

  .heroSpace{
    min-height:74vh;
  }

  .stats{
    width:min(720px,100%);

    margin-left:auto;
    margin-right:auto;
  }

  .monitor{
    width:min(1000px,100%);

    margin:auto;
  }
}

</style>
</head>

<body>

<div class="wallpaper"></div>

<div class="app">

  <section class="heroSpace">

    <div class="controls">

      <div
        class="live"
        id="connection"
      >
        <span class="dot"></span>
        CONNECTING
      </div>

      <button
        id="alertButton"
        class="alertBtn"
        type="button"
      >
        🔔 ENABLE iPHONE ALERTS
      </button>

    </div>

  </section>

  <section class="stats">

    <div class="stat">

      <strong id="monitored">
        18
      </strong>

      <span>
        Monitored Products
      </span>

    </div>

    <div class="stat">

      <strong id="stock">
        0
      </strong>

      <span>
        In Stock Now
      </span>

    </div>

    <div class="stat">

      <strong id="direct">
        0
      </strong>

      <span>
        Walmart Direct
      </span>

    </div>

  </section>

  <section class="monitor">

    <div class="monitorHead">

      <div>

        <div class="smallTitle">
          POKÉMON RESTOCKS
        </div>

        <h2>
          Live Product Monitoring
        </h2>

      </div>

      <div
        class="lastScan"
        id="lastScan"
      >
        Waiting for scan
      </div>

    </div>

    <div class="scanLine"></div>

    <main
      class="grid"
      id="products"
    >

      <div class="empty">

        <div class="radar"></div>

        <strong>
          Connecting to scanner...
        </strong>

        Establishing backend connection.

      </div>

    </main>

  </section>

  <div class="footer">

    POKÉMON RESTOCKS •
    WALMART DIRECT •
    MARKETPLACE FILTER •
    LIVE INVENTORY

  </div>

</div>

<script>

const API =
  "https://pokemon-live-backend.onrender.com";

const alertButton =
  document.getElementById(
    "alertButton"
  );

/* =========================
   HELPERS
========================= */

function esc(value){

  return String(
    value ?? ""
  )
  .replaceAll("&","&amp;")
  .replaceAll("<","&lt;")
  .replaceAll(">","&gt;")
  .replaceAll('"',"&quot;")
  .replaceAll("'","&#039;");
}

function money(value){

  const number =
    Number(value);

  if(
    !Number.isFinite(number)
  ){
    return "—";
  }

  return new Intl.NumberFormat(
    "en-US",
    {
      style:"currency",
      currency:"USD"
    }
  ).format(number);
}

/* =========================
   PRODUCT STATUS
========================= */

function getStatus(item){

  if(
    item.inStock === true &&
    item.directSeller === true
  ){
    return [
      "WALMART IN STOCK",
      "green"
    ];
  }

  if(
    item.marketplaceOnly === true
  ){
    return [
      "MARKETPLACE ONLY",
      "orange"
    ];
  }

  if(
    item.discoveryMode === true ||
    item.error ===
      "No validated Walmart-direct result found" ||
    item.error ===
      "No Walmart-sold result found"
  ){
    return [
      "NO DIRECT MATCH",
      "gray"
    ];
  }

  return [
    "OUT OF STOCK",
    "red"
  ];
}

/* =========================
   RENDER PRODUCTS
========================= */

function render(items){

  const root =
    document.getElementById(
      "products"
    );

  const direct =
    items.filter(
      item =>
        item.directSeller === true
    );

  const stock =
    items.filter(
      item =>
        item.directSeller === true &&
        item.inStock === true
    );

  document.getElementById(
    "stock"
  ).textContent =
    stock.length;

  document.getElementById(
    "direct"
  ).textContent =
    direct.length;

  if(
    items.length > 18
  ){
    document.getElementById(
      "monitored"
    ).textContent =
      items.length;
  }

  if(
    !items.length
  ){

    root.innerHTML = `
      <div class="empty">

        <div class="radar"></div>

        <strong>
          No scanner results yet
        </strong>

        Backend connected.
        Waiting for next inventory scan.

      </div>
    `;

    return;
  }

  root.innerHTML =
    items.map(
      item => {

        const [
          label,
          badge
        ] =
          getStatus(item);

        const cardClass =

          item.inStock === true &&
          item.directSeller === true

            ? "stockCard"

            : item.marketplaceOnly === true

              ? "marketCard"

              : "";

        const image =

          item.image

            ? `
              <img
                src="${esc(
                  item.image
                )}"
                alt=""
              >
            `

            : `
              <div class="placeholder">
                ⚡
              </div>
            `;

        const warning =

          item.marketplaceOnly === true

            ? `
              <div class="warning">

                ⚠ Marketplace seller detected.
                No Walmart-direct stock alert
                will fire.

              </div>
            `

            : "";

        const buy =

          item.url &&
          item.directSeller === true &&
          item.inStock === true

            ? `
              <a
                class="buy"
                href="${esc(
                  item.url
                )}"
                target="_blank"
                rel="noopener"
              >
                ⚡ OPEN WALMART NOW
              </a>
            `

            : "";

        return `
          <article
            class="card ${cardClass}"
          >

            <div class="cardTop">

              <div class="imageBox">
                ${image}
              </div>

              <div class="info">

                <div class="set">

                  ${esc(
                    item.set ||
                    "POKÉMON TCG"
                  )}

                </div>

                <div class="name">

                  ${esc(
                    item.name ||
                    "Pokémon Product"
                  )}

                </div>

                <div class="price">

                  ${money(
                    item.price
                  )}

                </div>

                <div
                  class="badge ${badge}"
                >
                  ${label}
                </div>

              </div>

            </div>

            <div class="meta">

              RETAILER:
              ${esc(
                (
                  item.retailer ||
                  "unknown"
                ).toUpperCase()
              )}

              <br>

              SELLER:
              ${esc(
                item.seller ||
                "Not available"
              )}

              ${
                item.sellerType

                  ? `
                    <br>

                    SELLER TYPE:

                    ${esc(
                      item.sellerType
                    )}
                  `

                  : ""
              }

              ${
                item.checkedAt

                  ? `
                    <br>

                    CHECKED:

                    ${
                      new Date(
                        item.checkedAt
                      ).toLocaleString()
                    }
                  `

                  : ""
              }

            </div>

            ${warning}

            ${buy}

          </article>
        `;
      }
    ).join("");
}

/* =========================
   BACKEND CONNECTION
========================= */

async function load(){

  const connection =
    document.getElementById(
      "connection"
    );

  try{

    const response =
      await fetch(
        `${API}/api/status`,
        {
          cache:"no-store"
        }
      );

    if(
      !response.ok
    ){
      throw new Error(
        `Backend ${response.status}`
      );
    }

    const data =
      await response.json();

    const items =
      Array.isArray(
        data.items
      )
        ? data.items
        : [];

    connection.innerHTML = `
      <span class="dot"></span>
      LIVE MONITOR CONNECTED
    `;

    connection.style.color =
      "var(--green)";

    render(items);

    document.getElementById(
      "lastScan"
    ).textContent =

      data.lastRun

        ? `Last scan ${
            new Date(
              data.lastRun
            ).toLocaleTimeString()
          }`

        : "Connected • waiting for scan";

  }

  catch(error){

    connection.innerHTML = `
      <span class="dot"></span>
      BACKEND OFFLINE
    `;

    connection.style.color =
      "var(--red)";

    document.getElementById(
      "products"
    ).innerHTML = `
      <div class="empty">

        <div class="radar"></div>

        <strong>
          Scanner connection failed
        </strong>

        ${esc(
          error.message
        )}

      </div>
    `;
  }
}

/* =========================
   ALERT BUTTON UI
========================= */

function setAlertButton(
  text,
  state = ""
){

  alertButton.textContent =
    text;

  alertButton.classList.remove(
    "enabled",
    "blocked"
  );

  if(state){

    alertButton.classList.add(
      state
    );
  }
}

/* =========================
   iPHONE ALERT PERMISSION
========================= */

async function enableAlerts(){

  setAlertButton(
    "🔔 CHECKING ALERTS..."
  );

  if(
    !(
      "Notification"
      in window
    )
  ){

    setAlertButton(
      "📱 ADD APP TO HOME SCREEN"
    );

    alert(
      "For iPhone notifications, add Pokémon Restock Monitor to your Home Screen. In Safari tap Share → Add to Home Screen. Then open the installed app and press this button again."
    );

    return;
  }

  try{

    let permission =
      Notification.permission;

    if(
      permission ===
      "default"
    ){

      permission =
        await Notification
          .requestPermission();
    }

    if(
      permission ===
      "granted"
    ){

      setAlertButton(
        "✅ ALERTS ENABLED",
        "enabled"
      );

      try{

        new Notification(
          "Pokémon Restock Monitor",
          {
            body:
              "⚡ Test successful! Pokémon restock alerts are enabled."
          }
        );

      }

      catch(error){

        console.log(
          "Test notification error:",
          error
        );
      }

      return;
    }

    if(
      permission ===
      "denied"
    ){

      setAlertButton(
        "⚠️ ALERTS BLOCKED",
        "blocked"
      );

      alert(
        "Notifications are blocked for Pokémon Restock Monitor. Check your iPhone notification settings, then reopen the app."
      );

      return;
    }

    setAlertButton(
      "🔔 ENABLE iPHONE ALERTS"
    );

  }

  catch(error){

    console.error(
      "Notification setup failed:",
      error
    );

    setAlertButton(
      "⚠️ ALERT SETUP FAILED",
      "blocked"
    );

    alert(
      "Notification setup could not start. Make sure you are opening the installed Pokémon Restock Monitor from your iPhone Home Screen."
    );
  }
}

/* =========================
   CLICK HANDLER
========================= */

alertButton.addEventListener(
  "click",
  enableAlerts
);

/* =========================
   CURRENT ALERT STATE
========================= */

function updateAlertButton(){

  if(
    !(
      "Notification"
      in window
    )
  ){
    return;
  }

  if(
    Notification.permission ===
    "granted"
  ){

    setAlertButton(
      "✅ ALERTS ENABLED",
      "enabled"
    );

  }

  else if(
    Notification.permission ===
    "denied"
  ){

    setAlertButton(
      "⚠️ ALERTS BLOCKED",
      "blocked"
    );
  }
}

/* =========================
   START APP
========================= */

updateAlertButton();

load();

/* Refresh dashboard data every 30 seconds.
   This checks our backend status endpoint.
   It does NOT itself make a Walmart API call. */

setInterval(
  load,
  30000
);

</script>

</body>
</html>
